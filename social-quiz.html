<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モミジの社会クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 横長スクリーン：左にキャラクター、右に吹き出しと操作。せまい画面では縦に積む */
:root{
  --bg:#f8ede4; --surface:#ffffff; --ink:#4a1f14; --muted:#86584a;
  --accent:#c2451d; --accent-ink:#ffffff; --good:#23845a; --warn:#a86400; --line:#ebcdbd;
  --display:"Kiwi Maru","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#22140f; --surface:#33201a; --ink:#f7e7dd; --muted:#c9a596;
  --accent:#ff9466; --accent-ink:#22140f; --good:#6fd39a; --warn:#f2c060; --line:#5a3a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#22140f; --surface:#33201a; --ink:#f7e7dd; --muted:#c9a596;
  --accent:#ff9466; --accent-ink:#22140f; --good:#6fd39a; --warn:#f2c060; --line:#5a3a2e; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
.app{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;max-width:1280px;margin:0 auto;min-height:100%;align-items:center}
@media (max-width:760px){.app{grid-template-columns:1fr;gap:12px}}
.stage{background:#d9875a;border-radius:20px;overflow:hidden;aspect-ratio:400/470;max-width:100%;max-height:88vh;justify-self:center;width:100%}
@media (max-width:760px){.stage{max-height:42vh;width:auto}}
.stage svg{display:block;width:100%;height:100%}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:clamp(14px,1.6vw,20px)}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}
.name{font-family:var(--display);color:var(--accent);font-size:clamp(16px,1.8vw,22px)}
.bubble{position:relative;background:var(--surface);border:3px solid var(--ink);border-radius:24px;padding:clamp(16px,2.4vw,32px);
  font-size:clamp(22px,3.1vw,44px);line-height:1.5;font-weight:700;text-wrap:balance;min-height:4.5em}
.bubble::before{content:"";position:absolute;left:-18px;top:44px;border:14px solid transparent;border-right:18px solid var(--ink);border-left:0}
@media (max-width:760px){.bubble::before{display:none}}
.status{display:flex;align-items:center;gap:12px;font-size:clamp(16px,2vw,26px);min-height:1.6em}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line);flex:none}
.listening .dot{background:#e0473f;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}
.heard{color:var(--muted)} .heard strong{color:var(--ink)}
.result{font-size:clamp(20px,2.6vw,34px);font-weight:700;min-height:1.4em}
.result.good{color:var(--good)} .result.bad{color:var(--warn)}
.hint{border-left:6px solid var(--warn);padding:8px 14px;font-size:clamp(18px,2.2vw,28px);background:var(--surface);border-radius:0 12px 12px 0}
.answer{display:flex;gap:10px;flex-wrap:wrap}
.answer input{flex:1 1 220px;min-width:0;font-family:var(--body);font-size:clamp(20px,2.6vw,32px);padding:.45em .7em;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink)}
.answer input:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:12px}
button{font-family:var(--body);font-weight:700;font-size:clamp(16px,1.9vw,24px);border-radius:14px;border:2px solid var(--ink);
  background:var(--surface);color:var(--ink);padding:.6em 1.1em;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:clamp(20px,2.4vw,30px);padding:.6em 1.6em}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.teacher{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:15px;border-top:1px dashed var(--line);padding-top:12px}
.teacher button{font-size:15px;padding:.4em .8em;border-width:1px}
.teacher label{display:flex;gap:6px;align-items:center}
.notice{background:var(--surface);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:15px}

/* キャラクターの動き */
#chara .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#chara .mouth-open{transform-box:fill-box;transform-origin:center top;opacity:0}
#chara.talking .mouth-open{opacity:1;animation:talk .22s infinite alternate}
#chara.talking .mouth-closed{opacity:0}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
#chara .happy-eyes,#chara .smile,#chara .q-mark{opacity:0}
#chara.happy .happy-eyes,#chara.happy .smile{opacity:1}
#chara.happy .eyes,#chara.happy .mouth-closed{opacity:0}
#chara.think .q-mark{opacity:1}
#chara.think .brows{transform:translateY(-4px)}
#chara .body{transition:transform .3s}
#chara.happy .body{animation:hop .5s 2}
@keyframes hop{50%{transform:translateY(-10px)}}
#chara .leaves .fall{transform-box:fill-box;transform-origin:center;opacity:0;animation:fall 7s linear infinite}
#chara .leaves g:nth-child(2) .fall{animation-delay:2.4s;animation-duration:8s}
#chara .leaves g:nth-child(3) .fall{animation-delay:4.6s;animation-duration:7.5s}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}12%{opacity:1}50%{transform:translate(-18px,80px) rotate(160deg)}85%{opacity:1}100%{opacity:0;transform:translate(10px,170px) rotate(320deg)}}
@media (prefers-reduced-motion:reduce){#chara *{animation:none!important}}
/* 範囲えらび（分野×単元） */
.unit{color:var(--muted);font-weight:700}
.bubble.compact{font-size:clamp(18px,2.2vw,30px);min-height:0}
.setup{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:8px}
.grid button{font-size:clamp(13px,1.45vw,19px);padding:.45em .35em;border-radius:12px;line-height:1.25;border-width:2px}
.grid .hd{background:transparent;color:var(--muted);border:2px dashed var(--line)}
.grid .hd.row{padding-inline:.7em}
.grid .cap{grid-column:2 / -1;align-self:center;color:var(--muted);font-size:clamp(13px,1.4vw,17px);padding-left:4px}
.grid .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:3.7em;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.grid .cell span{white-space:pre-line}
.grid .cell small{font-weight:500;font-size:.78em;color:var(--muted)}
.grid .cell[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid .cell[aria-pressed="true"] small{color:inherit;opacity:.85}
.setup-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
button small{display:block;font-size:max(13px,.55em);font-weight:500;margin-top:2px}
.quiz{display:flex;flex-direction:column;gap:16px}
.teacher select{font-family:var(--body);font-size:15px;padding:.3em .4em;border-radius:8px;border:1px solid var(--ink);background:var(--surface);color:var(--ink)}
@media (max-width:760px){.grid{gap:5px}.grid button{padding:.4em .2em}}
.result ruby.ans rt{font-size:.45em;font-weight:500;letter-spacing:.05em}
.result{line-height:1.6}
/* スマホ（縦）：モミジを小さくして吹き出しの横に並べる。
   出題中は主要ボタンを1画面目の下に置き（先生用はその下にスクロール）、はじめの画面は表とスタートを1画面に収める */
@media (max-width:760px){
  :root{--stageH:calc((100vw - 42px) * .37 * 1.175);--barPad:0px}
  @supports (-webkit-touch-callout:none){:root{--barPad:64px}} /* iPhoneのSafariは下にアドレスバーが重なるので、その分あける */
  body{padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:12px}
  .app{grid-template-columns:minmax(0,37%) minmax(0,1fr);gap:8px 10px;align-items:start;align-content:start;min-height:0}
  .panel{display:contents}
  .stage{grid-column:1;grid-row:1 / span 2;max-height:none;width:100%;align-self:start;border-radius:14px}
  .top{grid-column:2;grid-row:1;font-size:13px;gap:0 8px;line-height:1.35}
  .name{font-size:15px}
  .bubble,.bubble.compact{grid-column:2;grid-row:2;align-self:start;font-size:clamp(15px,4.4vw,19px);line-height:1.45;padding:10px 12px;min-height:0;border-width:2px;border-radius:16px}
  .setup,.quiz,.notice,.teacher{grid-column:1 / -1}
  /* はじめの画面 */
  .setup{gap:10px}
  .grid .cell{min-height:3.3em}
  .setup-actions{position:sticky;bottom:0;z-index:2;background:var(--bg);gap:8px;flex-wrap:nowrap;
    padding:8px 0 calc(max(8px,env(safe-area-inset-bottom,0px)) + var(--barPad))}
  .setup-actions button{flex:1 1 0;font-size:16px;padding:.55em .4em;line-height:1.3}
  .setup-actions button.primary{flex-grow:1.4;font-size:18px}
  /* 出題中：1画面目の高さいっぱいに広げ、ボタンを下にそろえる */
  .quiz{gap:8px;min-height:calc(100dvh - var(--stageH) - 32px)}
  .status{font-size:15px;gap:8px;min-height:1.4em}
  .dot{width:12px;height:12px}
  .answer{flex-wrap:nowrap;gap:8px}
  html{overflow-x:clip}
  .quiz,.answer,.controls{min-width:0}
  .answer input{flex:1 1 0;width:0;font-size:17px;padding:.4em .6em;border-radius:12px;text-overflow:ellipsis}
  .answer button.primary{font-size:17px;padding:.4em .9em;flex:none}
  .result{font-size:19px;min-height:0;line-height:1.45}
  .hint{font-size:15px;padding:6px 10px;border-left-width:5px}
  .controls{margin-top:auto;position:sticky;bottom:0;z-index:2;background:var(--bg);gap:8px;
    padding:8px 0 calc(max(8px,env(safe-area-inset-bottom,0px)) + var(--barPad))}
  .controls button{flex:1 1 auto;font-size:16px;padding:.7em .5em;border-radius:12px}
  .controls button.primary{font-size:17px;padding:.7em .6em}
  .teacher{margin-top:4px}
  /* 出題中は縦に積む：モミジを上に大きめに、吹き出しは横いっぱい。画面の高さに合わせてモミジの大きさを変える */
  .app:has(#quiz:not([hidden])){--SH:clamp(120px,calc(100dvh - 470px),46dvh);grid-template-columns:minmax(0,1fr);gap:8px}
  .app:has(#quiz:not([hidden])) .stage{grid-column:1;grid-row:auto;height:var(--SH);width:auto;justify-self:center;border-radius:18px}
  .app:has(#quiz:not([hidden])) .top{grid-column:1;grid-row:auto;font-size:14px}
  .app:has(#quiz:not([hidden])) .name{font-size:16px}
  .app:has(#quiz:not([hidden])) .bubble{grid-column:1;grid-row:auto;font-size:clamp(18px,5.6vw,25px);padding:12px 16px}
  .app:has(#quiz:not([hidden])) .quiz{min-height:calc(100dvh - var(--SH) - 200px)}
}
/* 横向きのスマホなど高さが低い画面でも、主要ボタンは画面下に固定 */
@media (max-height:520px){
  .controls{position:sticky;bottom:0;z-index:2;background:var(--bg);padding:8px 0}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <svg id="chara" viewBox="0 0 400 470" role="img" aria-label="出題するキャラクター、モミジ">
      <defs>
        <path id="mleaf" d="M0-13L3-6L9-9L7-2L13 0L7 3L9 9L2 6L1 13H-1L-2 6L-9 9L-7 3L-13 0L-7-2L-9-9L-3-6Z"/>
      </defs>
      <!-- 窓と秋の空 -->
      <rect x="0" y="0" width="400" height="470" fill="#d9875a"/>
      <rect x="40" y="36" width="320" height="230" rx="6" fill="#fbe6cf" stroke="#6e2c1a" stroke-width="8"/>
      <path d="M62 118q8-22 30-14q10-18 30-6q18-4 20 14q14 4 8 18H58q-8-6 4-12z" fill="#fff" stroke="#6e2c1a" stroke-width="2"/>
      <path d="M44 250q60-40 120-22q50-30 100-6q50-20 92 8V262H44z" fill="#c8673c"/>
      <path d="M44 262q70-24 140-10q60-18 172-2V262z" fill="#a9512d"/>
      <!-- 窓の外のもみじの枝 -->
      <path d="M356 46c-30 8-58 22-84 46M318 64c4 14 2 26-6 38" stroke="#6e2c1a" stroke-width="5" stroke-linecap="round" fill="none"/>
      <g stroke="#6e2c1a" stroke-width="1.6" stroke-linejoin="round">
        <use href="#mleaf" transform="translate(272 96) rotate(-20) scale(1.3)" fill="#d9472a"/>
        <use href="#mleaf" transform="translate(300 74) rotate(15) scale(1.1)" fill="#ec8a2f"/>
        <use href="#mleaf" transform="translate(334 58) rotate(-8) scale(1.2)" fill="#d9472a"/>
        <use href="#mleaf" transform="translate(312 106) rotate(30) scale(1.15)" fill="#e9632b"/>
        <use href="#mleaf" transform="translate(342 84) rotate(-35) scale(1)" fill="#f0a63a"/>
      </g>
      <path d="M200 36V266M40 150H360" stroke="#6e2c1a" stroke-width="6"/>
      <rect x="40" y="36" width="320" height="230" rx="6" fill="none" stroke="#6e2c1a" stroke-width="8"/>
      <!-- ひらひら落ちるもみじ -->
      <g class="leaves" stroke="#6e2c1a" stroke-width="1.4">
        <g transform="translate(84 60)"><g class="fall"><use href="#mleaf" fill="#e9632b"/></g></g>
        <g transform="translate(150 50)"><g class="fall"><use href="#mleaf" fill="#f0a63a" transform="scale(.85)"/></g></g>
        <g transform="translate(250 56)"><g class="fall"><use href="#mleaf" fill="#d9472a" transform="scale(.9)"/></g></g>
      </g>
      <!-- 地球儀（社会） -->
      <g>
        <path d="M44 468h64M76 452v16" stroke="#5b2416" stroke-width="5" stroke-linecap="round"/>
        <circle cx="76" cy="406" r="38" fill="#f7cfa6" stroke="#5b2416" stroke-width="3"/>
        <path d="M52 388c10-8 22-6 28 2c-2 8-12 10-12 18c-8 4-16-2-18-10zM86 384c8-4 18 0 20 8c-6 4-6 12-14 14c-6-6-10-14-6-22zM70 420c8-2 16 4 18 12c-6 4-14 4-18-2z" fill="#c8673c"/>
        <ellipse cx="76" cy="406" rx="16" ry="38" fill="none" stroke="#5b2416" stroke-width="1.6" opacity=".6"/>
        <path d="M38 406h76" stroke="#5b2416" stroke-width="1.6" opacity=".6"/>
        <path d="M76 360a46 46 0 0 1 0 92" stroke="#5b2416" stroke-width="5" fill="none"/>
      </g>
      <g class="body">
        <!-- 後ろ髪（短め） -->
        <ellipse cx="200" cy="176" rx="72" ry="72" fill="#8e3519"/>
        <!-- 首と服（パーカー） -->
        <rect x="186" y="262" width="28" height="40" fill="#f3cfb6"/>
        <path d="M96 470c4-100 30-150 74-166l30-8l30 8c44 16 70 66 74 166z" fill="#e48a4c" stroke="#5b2416" stroke-width="3"/>
        <path d="M158 300c12 30 72 30 84 0c10 6 16 14 18 24c-22 32-98 32-120 0c2-10 8-18 18-24z" fill="#f2ad78" stroke="#5b2416" stroke-width="3"/>
        <path d="M186 326l-2 40M214 326l2 40" stroke="#5b2416" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="184" cy="368" r="3.5" fill="#fff1e4" stroke="#5b2416" stroke-width="2"/>
        <circle cx="216" cy="368" r="3.5" fill="#fff1e4" stroke="#5b2416" stroke-width="2"/>
        <!-- 顔 -->
        <path d="M144 176c-2 62 10 96 34 110c14 8 30 8 44 0c24-14 36-48 34-110z" fill="#fbe4d2" stroke="#5b2416" stroke-width="3"/>
        <!-- 耳 -->
        <path d="M144 214c-14-6-18 14-6 24" fill="#fbe4d2" stroke="#5b2416" stroke-width="3"/>
        <path d="M256 214c14-6 18 14 6 24" fill="#fbe4d2" stroke="#5b2416" stroke-width="3"/>
        <!-- 前髪（短くはねた髪） -->
        <path d="M130 204c-8-74 26-108 70-108s80 32 70 108c-4-18-10-30-18-38l-4 24c-8-18-18-30-30-36l-6 26c-8-16-18-26-30-30l-8 28c-6-14-14-22-26-26l-6 30c-6-10-12-16-22-20z" fill="#8e3519" stroke="#5b2416" stroke-width="3" stroke-linejoin="round"/>
        <path d="M196 98c-6-16 2-28 16-32c-6 10-6 22-2 32" fill="#8e3519" stroke="#5b2416" stroke-width="3" stroke-linejoin="round"/>
        <!-- もみじのヘアピン -->
        <use href="#mleaf" transform="translate(242 160) rotate(18) scale(.95)" fill="#d9472a" stroke="#5b2416" stroke-width="1.6"/>
        <!-- まゆ -->
        <g class="brows" stroke="#5b2416" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M162 194q14-6 28-2"/><path d="M210 192q14-4 28 2"/>
        </g>
        <!-- 目 -->
        <g class="eyes">
          <ellipse cx="178" cy="218" rx="11" ry="10" fill="#fff"/>
          <ellipse cx="222" cy="218" rx="11" ry="10" fill="#fff"/>
          <ellipse cx="179" cy="219" rx="7" ry="8.5" fill="#5b2416"/>
          <ellipse cx="221" cy="219" rx="7" ry="8.5" fill="#5b2416"/>
          <circle cx="182" cy="215" r="2.6" fill="#fff"/><circle cx="224" cy="215" r="2.6" fill="#fff"/>
          <path d="M166 210q12-8 24 0M210 210q12-8 24 0" stroke="#5b2416" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>
        <g class="happy-eyes" stroke="#5b2416" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M166 222q12-14 24 0"/><path d="M210 222q12-14 24 0"/>
        </g>
        <path d="M200 236l-3 12h5" stroke="#5b2416" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="164" cy="246" rx="9" ry="4" fill="#f1a684" opacity=".7"/>
        <ellipse cx="236" cy="246" rx="9" ry="4" fill="#f1a684" opacity=".7"/>
        <!-- 口 -->
        <path class="mouth-closed" d="M191 261q9 4 18 0" stroke="#5b2416" stroke-width="3" stroke-linecap="round" fill="none"/>
        <ellipse class="mouth-open" cx="200" cy="264" rx="8" ry="7" fill="#5b2416"/>
        <path class="smile" d="M184 257q16 18 32 0z" fill="#5b2416"/>
        <!-- はてなマーク（ヒントのとき） -->
        <text class="q-mark" x="282" y="150" font-size="48" font-weight="700" fill="#fff" stroke="#5b2416" stroke-width="2" font-family="sans-serif">?</text>
        <!-- 社会の本 -->
        <g>
          <rect x="216" y="366" width="84" height="66" rx="4" fill="#b8401f" stroke="#5b2416" stroke-width="3"/>
          <path d="M224 366v66" stroke="#5b2416" stroke-width="2" opacity=".6"/>
          <rect x="236" y="378" width="52" height="20" rx="3" fill="#fbe4d2" stroke="#5b2416" stroke-width="2"/>
          <path d="M244 388h36" stroke="#5b2416" stroke-width="2.5" stroke-linecap="round"/>
          <use href="#mleaf" transform="translate(262 414) scale(.8)" fill="#f0a63a" stroke="#5b2416" stroke-width="1.6"/>
        </g>
        <path d="M206 390c-10 6-10 30 0 38c10 4 22 2 22-6v-28c0-6-12-8-22-4z" fill="#fbe4d2" stroke="#5b2416" stroke-width="3"/>
      </g>
    </svg>
  </div>

  <div class="panel">
    <div class="top">
      <span class="name">モミジ</span>
      <span class="unit" id="unitLabel"></span>
      <span id="scoreLine" hidden>第 <b id="qno">1</b> 問 / <b id="qtotal">10</b>　正解 <b id="score">0</b></span>
    </div>
    <div class="bubble compact" id="bubble" aria-live="polite">こんにちは、モミジです。出題する範囲を選んで「スタート」を押してね。</div>

    <!-- 範囲えらび -->
    <div class="setup" id="setup">
      <div class="grid" id="grid" role="group" aria-label="出題範囲（分野と単元）"></div>
      <div class="setup-actions">
        <button class="primary" id="startBtn">スタート<small id="startSub"></small></button>
        <button id="reviewBtn">まちがえた問題だけ<small id="reviewSub"></small></button>
      </div>
    </div>

    <!-- 出題中 -->
    <div class="quiz" id="quiz" hidden>
      <div class="status" id="status"><span class="dot"></span><span class="heard" id="heard">マイクは待機中</span></div>

function yomiOf(q){
  if (!/[一-龯々ヶ]/.test(q.a)) return "";
  return YOMI[q.a] || q.accept.find(a=>/^[ぁ-ゖー]+$/.test(a)) || "";
}
function answerNode(q){
  const y = yomiOf(q);
  if (!y) return document.createTextNode(q.a);
  const r = document.createElement("ruby"); r.className = "ans";
  r.append(q.a);
  const rt = document.createElement("rt"); rt.textContent = y;
  r.append(rt);
  return r;
}

}

QUESTIONS.forEach(q=>{ q.id = q.u + ":" + q.a; });
function unitLabel(u){ return FIELD_NAME[u[0]] + "・" + UNIT_SHORT[u]; }

/* ---------- 記録（この端末のブラウザに保存） ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem("momijiSocial." + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("momijiSocial." + k, JSON.stringify(v)); }catch(e){} }
};
let savedRange = store.get("range", null);
let sel = new Set(savedRange || []);
let missed = new Set(store.get("missed", []));
const params = new URLSearchParams(location.search);
if (params.get("range")){
  const r = params.get("range").split(/[,\s]+/).filter(u=>UNITS[u]);
  if (r.length) sel = new Set(r);
}
let qCount = Number(store.get("count", 10));
if (params.get("n") && !isNaN(Number(params.get("n")))) qCount = Number(params.get("n"));

const PRAISE = ["正解！すごいね。","正解！よく覚えているね。","その通り！","ばっちり正解！"];
const $ = id => document.getElementById(id);
const chara = $("chara");
let order = [], idx = 0, score = 0, tries = 0, done = false, rec = null, listening = false, misses = 0;
let mode = "normal", lastMode = "normal", roundMissed = [];

/* ---------- 文字のそろえ（カタカナ→ひらがな、空白や記号を除く） ---------- */
function norm(s){
  return (s||"").replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s、。．，,.！!？?「」ー〜~・]/g,"").toLowerCase();
}

/* ---------- 読み上げ ---------- */
/* モミジは男の子なので、端末に男性の日本語の声があればそれを使う。
   ないときは女性の声を低めにして、男の子らしく聞こえるようにする。先生用の欄で声を選びなおせる */
let jaVoice = null, voiceIsMale = false;
const MALE_VOICE = /otoya|hattori|ichiro|keita|daichi|naoki|takumi|male|男/i;
function voiceList(){ return "speechSynthesis" in window ? speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)) : []; }
function pickVoice(){
  const vs = voiceList();
  const saved = store.get("voice", "");
  jaVoice = (saved && vs.find(v=>v.name === saved)) || vs.find(v=>MALE_VOICE.test(v.name))
    || vs.find(v=>/google|kyoko|nanami|haruka/i.test(v.name)) || vs[0] || null;
  voiceIsMale = !!jaVoice && MALE_VOICE.test(jaVoice.name);
  fillVoiceSel();
}
function fillVoiceSel(){
  const sel = document.getElementById("voiceSel"); if (!sel) return;
  const vs = voiceList();
  sel.replaceChildren();
  for (const v of vs){
    const o = document.createElement("option"); o.value = v.name;
    o.textContent = v.name.replace(/^Microsoft |^Google /,"").replace(/ \(.*\)$/,"") + (MALE_VOICE.test(v.name) ? "（男性）" : "");
    sel.append(o);
  }
  if (jaVoice) sel.value = jaVoice.name;
  document.getElementById("voiceLabel").hidden = vs.length < 2;
}

const READING_KEYS = Object.keys(READINGS).sort((a,b)=>b.length-a.length);
function toReading(text){
  let s = text;
  for (const k of READING_KEYS) s = s.split(k).join(READINGS[k]);
  return s.replace(/◯+/g, "ほにゃらら");
}

function say(text, show=true){
  if (show) $("bubble").textContent = text;
  return new Promise(resolve=>{
    if (!("speechSynthesis" in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toReading(text));
    u.lang = "ja-JP"; u.rate = 0.95; u.pitch = voiceIsMale ? 1.05 : 0.8;
    if (jaVoice) u.voice = jaVoice;
    let finished = false;
    const end = ()=>{ if(finished) return; finished = true; chara.classList.remove("talking"); resolve(); };
    u.onstart = ()=>chara.classList.add("talking");
    u.onend = end; u.onerror = end;
    // 一部のタブレットで終了通知が来ないことへの保険
    setTimeout(end, 1500 + text.length * 220);
    chara.classList.add("talking");
    speechSynthesis.speak(u);
  });
}
function hush(){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  chara.classList.remove("talking");
}

function mood(m){ chara.classList.remove("happy","think"); if(m) chara.classList.add(m); }

/* ---------- 範囲えらびの表 ---------- */
function poolOf(units){ return QUESTIONS.filter(q=>units.has(q.u)); }
function reviewPool(){
  const scope = sel.size ? sel : new Set(Object.keys(UNITS));
  return QUESTIONS.filter(q=>scope.has(q.u) && missed.has(q.id));
}
function sameAsSaved(){
  if (!savedRange || !savedRange.length) return false;
  return [...sel].sort().join() === [...savedRange].sort().join();
}
function rangeSummary(units){
  const parts = [];
  for (const [f,fname] of FIELDS){
    const us = UNIT_NO.map(n=>f+n).filter(u=>units.has(u));
    if (!us.length) continue;
    parts.push(fname + (us.length === UNIT_NO.length ? " 全部" : " " + us.map(u=>UNIT_SHORT[u]).join("・")));
  }
  return parts.join("／");
}

function buildGrid(){
  const grid = $("grid"); grid.replaceChildren();
  const mk = (cls, html, onclick, label)=>{
    const b = document.createElement("button"); b.type = "button"; b.className = cls;
    b.innerHTML = html; b.onclick = onclick; if (label) b.setAttribute("aria-label", label);
    grid.append(b); return b;
  };
  mk("hd", "全部", ()=>toggleSet(Object.keys(UNITS)), "全部の範囲を選ぶ・外す");
  const cap = document.createElement("span"); cap.className = "cap";
  cap.textContent = "単元をタップ（いくつでも選べるよ）";
  grid.append(cap);
  for (const [f,fname] of FIELDS){
    mk("hd row", fname, ()=>toggleSet(UNIT_NO.map(n=>f+n)), fname + "をまとめて選ぶ・外す");
    for (const n of UNIT_NO){
      const u = f+n, cnt = QUESTIONS.filter(q=>q.u===u).length;
      const b = mk("cell", "", ()=>{ sel.has(u) ? sel.delete(u) : sel.add(u); refreshSetup(); }, fname + "：" + UNITS[u].replace("\n",""));
      b.dataset.u = u;
      const t = document.createElement("span"); t.textContent = UNITS[u];
      const s = document.createElement("small"); s.textContent = cnt + "問";
      b.append(t, s);
    }
  }
}
function toggleSet(units){
  const allOn = units.every(u=>sel.has(u));
  units.forEach(u=> allOn ? sel.delete(u) : sel.add(u));
  refreshSetup();
}
function refreshSetup(){
  document.querySelectorAll("#grid .cell").forEach(b=>b.setAttribute("aria-pressed", sel.has(b.dataset.u) ? "true" : "false"));
  const n = poolOf(sel).length;
  const sb = $("startBtn");
  if (!sel.size){
    sb.disabled = true; sb.firstChild.textContent = "スタート";
    $("startSub").textContent = "表から範囲を選んでね";
  } else {
    sb.disabled = false;
    sb.firstChild.textContent = sameAsSaved() ? "前回と同じ範囲でスタート" : "この範囲でスタート";
    $("startSub").textContent = rangeSummary(sel) + "（" + n + "問から出題）";
  }
  const r = reviewPool().length;
  $("reviewBtn").disabled = r === 0;
  $("reviewSub").textContent = r ? (sel.size ? "選んだ範囲で " : "全範囲で ") + r + "問" : "まだありません";
}

/* ---------- 音声認識 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function showNotice(t){ $("notice").textContent = t; $("notice").hidden = false; }
let canSR = false;
try { canSR = !!SR && window.top === window; } catch(e){ canSR = false; }
if (!canSR) $("autoLabel").hidden = true;

function setListening(on){
  listening = on;
  $("status").classList.toggle("listening", on);
  $("answerBtn").textContent = on ? "聞いています…" : "こたえる";
  $("answerBtn").disabled = on;
}

function listen(fromTap){
  if (!canSR || listening || done) return;
  speechSynthesis.cancel();
  rec = new SR();
  rec.lang = "ja-JP"; rec.interimResults = true; rec.maxAlternatives = 5; rec.continuous = false;
  let gotFinal = false, errored = false;
  $("heard").textContent = "話してください…";
  rec.onresult = e=>{
    const r = e.results[e.results.length-1];
    $("heard").innerHTML = "";
    const lab = document.createTextNode("聞こえた答え：");
    const st = document.createElement("strong"); st.textContent = r[0].transcript;
    $("heard").append(lab, st);
    if (r.isFinal){
      gotFinal = true;
      const alts = Array.from(r).map(x=>x.transcript);
      judge(alts);
    }
  };
  rec.onerror = e=>{
    setListening(false);
    if (e.error !== "no-speech") errored = true;
    const blocked = e.error === "not-allowed" || e.error === "service-not-allowed";
    if (blocked && !fromTap){
      $("answerBtn").hidden = false;
      $("heard").textContent = "「こたえる」を押してから話してね";
      return;
    }
    if (e.error !== "no-speech" && e.error !== "aborted") showNotice("聞きとりエラー（" + e.error + "）");
    if (blocked){
      $("heard").textContent = "マイクが使えませんでした。先生用ボタンで進めてください";
    } else if (e.error === "network"){
      showNotice("聞きとりにはインターネット接続が必要です。");
    }
  };
  rec.onend = ()=>{
    setListening(false);
    if (!gotFinal && !done && !errored && order.length){
      misses++;
      $("heard").textContent = "聞きとれませんでした。「こたえる」でもう一度";
      say("ごめんね、よく聞こえなかったよ。もう一度言ってみて。", false)
        .then(()=>{ if ($("autoListen").checked && !done && misses <= 1) listen(); });
    }
  };
  setListening(true);
  try { rec.start(); } catch(err){ setListening(false); }
}
function stopListening(){
  if (rec) try{ rec.onend = null; rec.abort(); }catch(e){}
  setListening(false);
}

/* ---------- 判定 ---------- */
function judge(alts){
  if (done) return;
  isRight(alts) ? correct() : wrong();
}

function isRight(alts){
  const q = order[idx];
  const keys = q.accept.map(norm), ng = (q.ng||[]).map(norm);
  return alts.some(a=>{
    const n = norm(a);
    return n && !ng.some(k=>n.includes(k)) && keys.some(k=>n.includes(k));
  });
}

let typeTimer = null;
function submitTyped(){
  clearTimeout(typeTimer);
  const inp = $("answerInput"); const v = inp.value.trim();
  if (!v || done) return;
  inp.value = ""; inp.blur();
  judge([v]);
}

function markMissed(q){
  missed.add(q.id); store.set("missed", [...missed]);
  if (!roundMissed.includes(q)) roundMissed.push(q);
}

function correct(){
  if (done) return;
  done = true; score++; $("score").textContent = score;
  const q = order[idx];
  if (tries === 0 && missed.has(q.id)){ missed.delete(q.id); store.set("missed", [...missed]); }
  mood("happy");
  $("result").className = "result good";
  showAnswer("正解！ 答え：", q);
  $("hint").hidden = false; $("hint").textContent = q.note;
  showAfter();
  say(PRAISE[Math.floor(Math.random()*PRAISE.length)] + "答えは、" + q.a + "。" + q.note, false);
}

function wrong(){
  if (done) return;
  const q = order[idx];
  tries++;
  markMissed(q);
  $("result").className = "result bad";
  if (tries <= q.hints.length){
    mood("think");
    $("result").textContent = "おしい！ もう一度考えてみよう";
    $("hint").hidden = false; $("hint").textContent = "ヒント" + tries + "：" + q.hints[tries-1];
    say((tries===1 ? "うーん、ちがうみたい。ヒントだよ。" : "もうひとつヒント。") + q.hints[tries-1], false)
      .then(()=>{ if ($("autoListen").checked && !done) listen(); });
  } else {
    reveal();
  }
}

function reveal(){
  if (done) return;
  done = true;
  const q = order[idx];
  markMissed(q);
  mood(null);
  $("result").className = "result bad";
  showAnswer("答え：", q);
  $("hint").hidden = false; $("hint").textContent = q.note;
  showAfter();
  say("正解は、" + q.a + "でした。" + q.note + "次はがんばろう。", false);
}

function showAfter(){
  stopListening();
  $("answerBtn").hidden = true; $("revealBtn").hidden = true; $("answerForm").hidden = true;
  $("nextBtn").hidden = false;
  $("nextBtn").textContent = idx === order.length-1 ? "結果を見る" : "次の問題";
}

/* ---------- 進行 ---------- */
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function ask(){
  const q = order[idx];
  done = false; tries = 0; misses = 0; mood(null);
  $("notice").hidden = true;
  $("qno").textContent = idx+1;
  $("unitLabel").textContent = unitLabel(q.u) + (mode === "review" ? "（復習）" : "");
  $("result").textContent = ""; $("hint").hidden = true;
  $("heard").textContent = canSR ? "マイクは待機中" : "答えのらんをタップ → キーボードのマイクで話してね";
  $("answerBtn").hidden = !canSR; $("repeatBtn").hidden = false; $("revealBtn").hidden = false;
  $("answerForm").hidden = false; $("answerInput").value = "";
  $("nextBtn").hidden = true;
  say(q.q).then(()=>{ if ($("autoListen").checked && !done) listen(); });
}

function start(m){
  mode = m || "normal";
  let pool;
  if (mode === "review"){
    pool = reviewPool();
  } else {
    pool = poolOf(sel);
    savedRange = [...sel]; store.set("range", savedRange);
  }
  if (!pool.length) return;
  lastMode = mode;
  order = shuffle(pool); if (qCount > 0) order = order.slice(0, qCount);
  idx = 0; score = 0; roundMissed = [];
  $("score").textContent = 0; $("qtotal").textContent = order.length;
  $("setup").hidden = true; $("quiz").hidden = false; $("scoreLine").hidden = false; $("quitBtn").hidden = false;
  $("bubble").classList.remove("compact");
  ["againBtn","retryMissBtn","menuBtn"].forEach(id=>$(id).hidden = true);
  $("result").textContent = ""; $("hint").hidden = true;
  const intro = mode === "review" ? "まちがえた問題の復習をするよ。今度はばっちり答えてね。" : "それじゃあ始めるよ。答えがわかったら、声で答えてね。";
  say(intro, true).then(()=>{ if (order.length) ask(); });
}

function next(){
  if (idx < order.length-1){ idx++; ask(); }
  else finish();
}

function finish(){
  done = true;
  stopListening();
  mood(score >= order.length*0.7 ? "happy" : null);
  $("answerBtn").hidden = true; $("repeatBtn").hidden = true; $("revealBtn").hidden = true; $("nextBtn").hidden = true; $("answerForm").hidden = true;
  $("unitLabel").textContent = "結果";
  $("result").className = "result good";
  $("result").textContent = order.length + "問中 " + score + "問 正解";
  $("hint").hidden = true;
  $("againBtn").hidden = false;
  $("retryMissBtn").hidden = roundMissed.length === 0;
  $("menuBtn").hidden = false;
  const msg = score === order.length ? "全問正解！ばっちりだね。"
    : score >= order.length*0.7 ? "よくできました！まちがえた用語は、もう一度復習しておこう。"
    : "おつかれさま。まちがえた用語は、教科書で確認しておこうね。";
  say(order.length + "問中、" + score + "問正解。" + msg);
}

function retryRound(){
  // 今回まちがえた問題だけを、すぐにもう一度
  const pool = roundMissed.slice();
  if (!pool.length) return;
  mode = "review";
  order = shuffle(pool); idx = 0; score = 0; roundMissed = [];
  $("score").textContent = 0; $("qtotal").textContent = order.length;
  ["againBtn","retryMissBtn","menuBtn"].forEach(id=>$(id).hidden = true);
  $("result").textContent = "";
  say("今まちがえた問題を、もう一度やってみよう。", true).then(()=>{ if (order.length) ask(); });
}

function menu(){
  hush(); stopListening();
  order = []; done = true; mood(null);
  $("quiz").hidden = true; $("setup").hidden = false; $("scoreLine").hidden = true; $("quitBtn").hidden = true;
  $("notice").hidden = true;
  $("unitLabel").textContent = "";
  $("bubble").classList.add("compact");
  $("bubble").textContent = "出題する範囲を選んで「スタート」を押してね。";
  refreshSetup();
}

/* ---------- ボタン ---------- */
$("startBtn").onclick = ()=>start("normal");
$("reviewBtn").onclick = ()=>start("review");
$("againBtn").onclick = ()=> lastMode === "review" && reviewPool().length ? start("review") : start("normal");
$("retryMissBtn").onclick = retryRound;
$("menuBtn").onclick = menu;
$("quitBtn").onclick = menu;
$("answerBtn").onclick = ()=>listen(true);
$("answerForm").addEventListener("submit", e=>{ e.preventDefault(); submitTyped(); });
$("answerInput").addEventListener("input", e=>{
  clearTimeout(typeTimer);
  if (e.isComposing || done || !order.length) return;
  const v = $("answerInput").value.trim();
  if (!v) return;
  const st = document.createElement("strong"); st.textContent = v;
  $("heard").replaceChildren(document.createTextNode("聞こえた答え："), st);
  typeTimer = setTimeout(submitTyped, isRight([v]) ? 700 : 2500);
});
$("answerInput").addEventListener("focus", ()=>{ if ("speechSynthesis" in window) speechSynthesis.cancel(); });
$("repeatBtn").onclick = ()=>{ if(!done) say(order[idx].q); };
$("revealBtn").onclick = reveal;
$("nextBtn").onclick = next;
$("okBtn").onclick = ()=>{ if(order.length && !done) correct(); };
$("ngBtn").onclick = ()=>{ if(order.length && !done) wrong(); };

if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
$("voiceSel").onchange = ()=>{ store.set("voice", $("voiceSel").value); pickVoice(); say("ぼくの声は、これでいいかな？", false); };
$("autoListen").checked = !!store.get("auto", false);
$("autoListen").onchange = ()=>store.set("auto", $("autoListen").checked);
if (![...$("countSel").options].some(o=>o.value === String(qCount))){
  const o = document.createElement("option"); o.value = String(qCount); o.textContent = qCount + "問"; $("countSel").append(o);
}
$("countSel").value = String(qCount);
$("countSel").onchange = ()=>{ qCount = Number($("countSel").value); store.set("count", qCount); };

let clearArmed = null;
$("clearBtn").onclick = ()=>{
  if (!clearArmed){
    $("clearBtn").textContent = "もう一度押すと消します";
    clearArmed = setTimeout(()=>{ clearArmed = null; $("clearBtn").textContent = "まちがい記録を消す"; }, 4000);
    return;
  }
  clearTimeout(clearArmed); clearArmed = null;
  missed.clear(); store.set("missed", []);
  $("clearBtn").textContent = "消しました";
  setTimeout(()=>{ $("clearBtn").textContent = "まちがい記録を消す"; }, 2000);
  refreshSetup();
};

document.addEventListener("keydown", e=>{
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space" && !$("answerBtn").hidden && !$("quiz").hidden){ e.preventDefault(); listen(true); }
  if (e.key === "Enter" && !$("nextBtn").hidden){ e.preventDefault(); next(); }
});

buildGrid();
refreshSetup();

/* iPhoneのChromeなどは下のバーがページに重ならないので、Safari用の余白をなくす */
if (/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent)) document.documentElement.style.setProperty("--barPad","0px");
/* スマホ縦で出題中：ボタンがちょうど1画面目の下に来るよう、出題エリアの高さを画面に合わせる */
(function(){
  const quiz = $("quiz");
  const mq = matchMedia("(max-width:760px)");
  let busy = false;
  function fit(){
    if (busy) return; busy = true;
    if (mq.matches && !quiz.hidden){
      const top = quiz.getBoundingClientRect().top + scrollY;
      const pb = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
      quiz.style.minHeight = Math.max(0, Math.floor(innerHeight - top - pb)) + "px";
    } else quiz.style.minHeight = "";
    busy = false;
  }
  new MutationObserver(()=>requestAnimationFrame(fit)).observe(quiz, {attributes:true, attributeFilter:["hidden"]});
  new MutationObserver(()=>requestAnimationFrame(fit)).observe($("bubble"), {childList:true, characterData:true, subtree:true});
  addEventListener("resize", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);
})();
</script>
</body>
